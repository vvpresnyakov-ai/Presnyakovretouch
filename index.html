<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Auto Retouch</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #18181b);
            --text: var(--tg-theme-text-color, #ffffff);
            --card: var(--tg-theme-secondary-bg-color, #27272a);
            --accent: var(--tg-theme-button-color, #3b82f6);
            --accent-text: var(--tg-theme-button-text-color, #ffffff);
        }
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .upload-area {
            width: 100%;
            height: 220px;
            border: 2px dashed #52525b;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background: var(--card);
            margin-top: 20px;
            text-align: center;
            padding: 20px;
        }
        .upload-area span { font-size: 40px; margin-bottom: 10px; }
        .compare-wrapper {
            position: relative;
            width: 100%;
            max-width: 450px;
            border-radius: 14px;
            overflow: hidden;
            display: none;
            background: #000;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
        }
        #canvas-before {
            position: absolute;
            top: 0;
            left: 0;
            clip-path: inset(0 50% 0 0);
        }
        .slider-line {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background: #fff;
            pointer-events: none;
            box-shadow: 0 0 6px rgba(0,0,0,0.8);
        }
        .slider-handle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 32px;
            height: 32px;
            background: #fff;
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .controls {
            width: 100%;
            max-width: 450px;
            display: none;
            flex-direction: column;
            gap: 14px;
            margin-top: 16px;
        }
        .presets {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .preset-btn {
            background: var(--card);
            color: var(--text);
            border: 2px solid transparent;
            padding: 10px 6px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }
        .preset-btn.active {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.15);
        }
        .intensity-box {
            background: var(--card);
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .intensity-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            opacity: 0.9;
        }
        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }
        .top-bar {
            width: 100%;
            max-width: 450px;
            display: none;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .small-btn {
            background: var(--card);
            color: var(--text);
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
        }
        .send-btn {
            background: var(--accent);
            color: var(--accent-text);
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 4px;
            transition: opacity 0.2s;
        }
        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="top-bar" id="top-bar">
        <label class="small-btn">
            🔄 Другое фото
            <input type="file" id="upload-new" accept="image/*" hidden>
        </label>
        <span style="font-size: 12px; opacity: 0.6; align-self: center;">Двигайте шторку по фото</span>
    </div>

    <label class="upload-area" id="upload-box">
        <span>📸</span>
        <strong>Нажмите, чтобы загрузить портрет</strong>
        <p style="font-size: 13px; opacity: 0.7; margin-top: 6px;">Автоматическая чистка кожи и светотеневая коррекция</p>
        <input type="file" id="upload" accept="image/*" hidden>
    </label>

    <div class="compare-wrapper" id="compare-wrapper">
        <canvas id="canvas-after"></canvas>
        <canvas id="canvas-before"></canvas>
        <div class="slider-line" id="slider-line">
            <div class="slider-handle">↔</div>
        </div>
    </div>

    <div class="controls" id="controls">
        <div class="presets">
            <button class="preset-btn active" onclick="selectPreset('heal', this)">✨ Auto Heal<br><span style="font-size:11px;font-weight:400;opacity:0.7">Чистая кожа</span></button>
            <button class="preset-btn" onclick="selectPreset('db', this)">☀️ Dodge&Burn<br><span style="font-size:11px;font-weight:400;opacity:0.7">Объем и свет</span></button>
            <button class="preset-btn" onclick="selectPreset('pro', this)">💎 Pro Retouch<br><span style="font-size:11px;font-weight:400;opacity:0.7">Всё вместе</span></button>
        </div>

        <div class="intensity-box">
            <div class="intensity-header">
                <span>Сила ретуши</span>
                <span id="val-text">70%</span>
            </div>
            <input type="range" id="intensity" min="0" max="100" value="70">
        </div>

        <button class="send-btn" id="send-btn" onclick="sendToTelegramChat()">📩 Отправить фото в чат</button>
    </div>

    <script>
        const BOT_TOKEN = '8765682148:AAHytq6t1GnIT2OpOK6k66As3ER64dnfaJk';
        const tg = window.Telegram.WebApp;
        tg.expand();

        const uploadBox = document.getElementById('upload-box');
        const compareWrapper = document.getElementById('compare-wrapper');
        const controls = document.getElementById('controls');
        const topBar = document.getElementById('top-bar');
        const sendBtn = document.getElementById('send-btn');
        
        const canvasBefore = document.getElementById('canvas-before');
        const ctxBefore = canvasBefore.getContext('2d');
        const canvasAfter = document.getElementById('canvas-after');
        const ctxAfter = canvasAfter.getContext('2d', { willReadFrequently: true });

        const intensityInput = document.getElementById('intensity');
        const valText = document.getElementById('val-text');
        const sliderLine = document.getElementById('slider-line');

        let originalImg = null;
        let currentPreset = 'heal';

        function handleFile(e) {
            const file = e.target.files.item(0);
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = new Image();
                img.onload = function() {
                    const maxDim = 1280;
                    let w = img.width;
                    let h = img.height;
                    if (w > maxDim || h > maxDim) {
                        const r = Math.min(maxDim / w, maxDim / h);
                        w = Math.round(w * r);
                        h = Math.round(h * r);
                    }
                    canvasBefore.width = canvasAfter.width = w;
                    canvasBefore.height = canvasAfter.height = h;
                    
                    ctxBefore.drawImage(img, 0, 0, w, h);
                    originalImg = img;

                    uploadBox.style.display = 'none';
                    compareWrapper.style.display = 'block';
                    controls.style.display = 'flex';
                    topBar.style.display = 'flex';

                    processImage();

                    tg.MainButton.setText("📩 Отправить фото в чат");
                    tg.MainButton.show();
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

        document.getElementById('upload').addEventListener('change', handleFile);
        document.getElementById('upload-new').addEventListener('change', handleFile);

        function selectPreset(preset, btn) {
            currentPreset = preset;
            document.querySelectorAll('.preset-btn').forEach(function(b) {
                b.classList.remove('active');
            });
            btn.classList.add('active');
            processImage();
        }

        intensityInput.addEventListener('input', function() {
            valText.innerText = intensityInput.value + '%';
            processImage();
        });

        function processImage() {
            if (!originalImg) return;
            const w = canvasAfter.width;
            const h = canvasAfter.height;
            const strength = intensityInput.value / 100;

            ctxAfter.clearRect(0, 0, w, h);
            ctxAfter.filter = 'none';
            ctxAfter.globalAlpha = 1;
            ctxAfter.globalCompositeOperation = 'source-over';
            ctxAfter.drawImage(originalImg, 0, 0, w, h);

            if (strength === 0) return;

            if (currentPreset === 'heal' || currentPreset === 'pro') {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = w;
                tempCanvas.height = h;
                const tCtx = tempCanvas.getContext('2d');

                const blurRadius = Math.max(4, Math.round(w * 0.012));
                tCtx.filter = 'blur(' + blurRadius + 'px)';
                tCtx.drawImage(originalImg, 0, 0, w, h);

                const origData = ctxAfter.getImageData(0, 0, w, h);
                const blurData = tCtx.getImageData(0, 0, w, h);
                const d = origData.data;
                const b = blurData.data;

                for (let i = 0; i < d.length; i += 4) {
                    const r = d.at(i);
                    const g = d.at(i + 1);
                    const bl = d.at(i + 2);
                    const isSkin = (r > 95 && g > 40 && bl > 20 && r > g && r > bl && Math.abs(r - g) > 15);
                    if (isSkin) {
                        const alpha = strength * 0.65;
                        d.set(Uint8ClampedArray.of(
                            r * (1 - alpha) + b.at(i) * alpha,
                            g * (1 - alpha) + b.at(i + 1) * alpha,
                            bl * (1 - alpha) + b.at(i + 2) * alpha
                        ), i);
                    }
                }
                ctxAfter.putImageData(origData, 0, 0);
            }

            if (currentPreset === 'db' || currentPreset === 'pro') {
                ctxAfter.save();
                ctxAfter.globalCompositeOperation = 'soft-light';
                ctxAfter.globalAlpha = strength * 0.55;
                ctxAfter.filter = 'contrast(135%) brightness(105%)';
                ctxAfter.drawImage(canvasAfter, 0, 0);
                ctxAfter.restore();
            }
        }

        function moveSlider(e) {
            const rect = compareWrapper.getBoundingClientRect();
            const touch = e.touches ? e.touches.item(0) : null;
            const clientX = touch ? touch.clientX : e.clientX;
            let pos = ((clientX - rect.left) / rect.width) * 100;
            pos = Math.max(0, Math.min(100, pos));
            canvasBefore.style.clipPath = 'inset(0 ' + (100 - pos) + '% 0 0)';
            sliderLine.style.left = pos + '%';
        }

        compareWrapper.addEventListener('mousemove', function(e) {
            if (e.buttons === 1) moveSlider(e);
        });
        compareWrapper.addEventListener('touchmove', moveSlider);
        compareWrapper.addEventListener('click', moveSlider);

        async function sendToTelegramChat() {
            const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
            if (!user || !user.id) {
                tg.showAlert("Не удалось определить ваш Telegram ID. Убедитесь, что приложение открыто внутри Telegram.");
                return;
            }

            sendBtn.disabled = true;
            sendBtn.innerText = "⏳ Отправляем в чат...";
            tg.MainButton.showProgress();

            canvasAfter.toBlob(async function(blob) {
                if (!blob) {
                    tg.showAlert("Ошибка при формировании изображения.");
                    resetBtn();
                    return;
                }

                const formData = new FormData();
                formData.append('chat_id', user.id);
                formData.append('document', blob, 'retouched_portrait.jpg');
                formData.append('caption', '✨ Ваше отретушированное фото готово!');

                try {
                    const response = await fetch('https://api.telegram.org/bot' + BOT_TOKEN + '/sendDocument', {
                        method: 'POST',
                        body: formData
                    });
                    const result = await response.json();

                    if (result.ok) {
                        tg.showAlert("✅ Готово! Фото отправлено в личные сообщения с ботом без потери качества.");
                    } else {
                        tg.showAlert("Ошибка Telegram: " + (result.description || "не удалось отправить файл. Убедитесь, что вы нажали /start в боте."));
                    }
                } catch (err) {
                    tg.showAlert("Ошибка сети при отправке файла: " + err.message);
                } finally {
                    resetBtn();
                }
            }, 'image/jpeg', 0.95);
        }

        function resetBtn() {
            sendBtn.disabled = false;
            sendBtn.innerText = "📩 Отправить фото в чат";
            tg.MainButton.hideProgress();
        }

        tg.MainButton.onClick(sendToTelegramChat);
    </script>
</body>
</html>
